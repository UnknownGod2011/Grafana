services:
  simulator:
    build:
      context: ./runtime
    environment:
      STAGEGUARD_SCENARIO: faulted
    ports:
      - "9108:9108"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9108/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2h
    volumes:
      - ./runtime/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      simulator:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: stageguard-local-only
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./runtime/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # Explicitly opt-in so a normal `docker compose up` never starts an AI/MCP
  # process. StageGuard itself permits only the datasource/Prometheus/Loki read
  # categories and disables write/proxied tools.
  mcp:
    image: grafana/mcp-grafana:1.3.0
    profiles: ["mcp"]
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE: /run/secrets/grafana-mcp-token
    volumes:
      - ./runtime/.secrets/grafana-mcp-token:/run/secrets/grafana-mcp-token:ro
    command:
      - -t
      - stdio
      - --disable-write
      - --enabled-tools
      - datasource,prometheus,loki
      - --disable-proxied
      - --max-loki-log-limit
      - "8"
    depends_on:
      - grafana
