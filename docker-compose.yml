services:
  simulator:
    build:
      context: ./runtime
    environment:
      # Start the recording stack healthy. The release rehearsal injects the
      # uplink-b fault explicitly after the baseline has been verified.
      STAGEGUARD_SCENARIO: healthy
    ports:
      - "9108:9108"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9108/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Credential-free, metrics-only fixture for rehearsing the StageGuard runtime
  # watchdog dashboard/alert. It is not a remediation provider and exposes no
  # incident mutation surface. Host publishing is loopback-only.
  watchdog-fixture:
    build:
      context: ./runtime
    command: ["python", "/app/watchdog_metrics_fixture.py"]
    ports:
      - "127.0.0.1:9111:9111"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9111/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Reproducibility matters here: the acceptance rehearsal depends on concrete
  # PromQL/sample-aging behavior, so never float this image on `latest`.
  # Prometheus 3.13 is the current LTS line (support through 2027-07-31); 3.13.3
  # was released 2026-09-07.
  prometheus:
    image: prom/prometheus:v3.13.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2h
    volumes:
      - ./runtime/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      simulator:
        condition: service_healthy
      watchdog-fixture:
        condition: service_healthy

  # Grafana alert provisioning and active-alert API behavior are part of the
  # acceptance contract, so pin the stable patch instead of following `latest`.
  grafana:
    image: grafana/grafana:13.2.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: stageguard-local-only
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./runtime/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./runtime/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # Explicitly opt-in so a normal `docker compose up` never starts an AI/MCP
  # process. StageGuard itself permits only the datasource/Prometheus/Loki read
  # categories and disables write/proxied tools.
  mcp:
    image: grafana/mcp-grafana:1.3.0
    profiles: ["mcp"]
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE: /run/secrets/grafana-mcp-token
    volumes:
      - ./runtime/.secrets/grafana-mcp-token:/run/secrets/grafana-mcp-token:ro
    command:
      - -t
      - stdio
      - --disable-write
      - --enabled-tools
      - datasource,prometheus,loki
      - --disable-proxied
      - --max-loki-log-limit
      - "8"
    depends_on:
      - grafana
