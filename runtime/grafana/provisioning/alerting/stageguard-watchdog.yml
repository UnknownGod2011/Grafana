apiVersion: 1

groups:
  - orgId: 1
    name: StageGuard runtime safety
    folder: StageGuard
    interval: 10s
    rules:
      - uid: stageguard-remediation-deadline
        title: StageGuard remediation execution deadline exceeded
        condition: B
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: stageguard-prometheus
            model:
              expr: max(stageguard_remediation_execution_deadline_exceeded)
              hide: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: -100
            model:
              conditions:
                - evaluator:
                    params: [0.5]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: -100
              hide: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        dashboardUid: stageguard-runtime-safety
        panelId: 2
        noDataState: NoData
        execErrState: Error
        for: 10s
        annotations:
          summary: StageGuard remediation execution exceeded its configured safety deadline
          description: StageGuard has withdrawn readiness while a remediation call remains in flight beyond its bounded execution window. Do not replay remediation; inspect the incident lifecycle and provider state before reconciliation.
        labels:
          component: stageguard-runtime
          severity: critical

      - uid: stageguard-runtime-telemetry-stale
        title: StageGuard runtime telemetry stale
        condition: B
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: stageguard-prometheus
            model:
              expr: max(time() - timestamp(stageguard_remediation_execution_deadline_exceeded)) or vector(1000000000) * absent(stageguard_remediation_execution_deadline_exceeded)
              hide: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: -100
            model:
              conditions:
                - evaluator:
                    params: [45]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: -100
              hide: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        dashboardUid: stageguard-runtime-safety
        panelId: 5
        noDataState: Alerting
        execErrState: Error
        for: 30s
        annotations:
          summary: StageGuard runtime watchdog telemetry is stale or missing
          description: The watchdog evidence plane has not delivered a fresh deadline sample within 45 seconds. Treat watchdog health as unknown until Prometheus ingestion is restored; do not infer remediation safety from an old zero value.
        labels:
          component: stageguard-runtime
          severity: warning

      - uid: stageguard-runtime-scrape-down
        title: StageGuard runtime watchdog scrape failing
        condition: B
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: stageguard-prometheus
            model:
              expr: max(up{job="stageguard-runtime-watchdog"})
              hide: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: -100
            model:
              conditions:
                - evaluator:
                    params: [0.5]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: -100
              hide: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        dashboardUid: stageguard-runtime-safety
        panelId: 6
        noDataState: Alerting
        execErrState: Error
        for: 20s
        annotations:
          summary: Prometheus cannot scrape the StageGuard runtime watchdog target
          description: The watchdog scrape target is down or unavailable. Investigate the metrics bridge, IAM/network path, and StageGuard /metrics readiness. Treat runtime safety evidence as degraded; this warning does not itself mean a remediation deadline was exceeded.
        labels:
          component: stageguard-runtime
          severity: warning
